  #   command: >
  #     --model ${TRANSCRIBER_MODEL:-openai/whisper-large-v3-turbo}
  #     --trust-remote-code
  #     --async-scheduling
  #     --gpu_memory_utilization 0.3
  #   restart: on-failure
  #   networks:
