apiVersion: v2
name: openrag-stack
description: A Helm chart for Kubernetes
type: application

version: 0.6.5
appVersion: "2.2.1"

maintainers:
  - name: linagora
    email: openrag@linagora.com
    url: https://github.com/linagora/openrag

home: https://github.com/linagora/openrag
sources:
  - https://github.com/linagora/openrag

dependencies:
  - name: kuberay-operator
    version: "1.4.0"
    repository: "https://ray-project.github.io/kuberay-helm/"
    alias: kuberay
    condition: kuberay.enabled
  - name: postgresql
    version: ">=17.6.0 <19.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: milvus
    # 5.0.26 declares Milvus 3.0.0 but was never added to the published index,
    # so helm cannot resolve it. 5.0.27 is the first *indexed* chart with Milvus
    # 3 defaults (appVersion and image.all.tag are both v3.0.1), so values.yaml
    # no longer overrides the image tag.
    version: "5.0.27"
    repository: "https://zilliztech.github.io/milvus-helm/"
    condition: milvus.enabled
  - name: vllm-stack
    alias: vllm
    version: ">=0.1.7 <1.0.0"
    repository: "https://vllm-project.github.io/production-stack"
    condition: vllm.enabled
