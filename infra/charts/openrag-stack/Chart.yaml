apiVersion: v2
name: openrag-stack
description: A Helm chart for Kubernetes
type: application

version: 0.7.12
appVersion: "2.3.3"

maintainers:
  - name: linagora
    email: openrag@linagora.com
    url: https://github.com/linagora/openrag

home: https://github.com/linagora/openrag
sources:
  - https://github.com/linagora/openrag

dependencies:
  - name: kuberay-operator
    version: "1.4.0"
    repository: "https://ray-project.github.io/kuberay-helm/"
    alias: kuberay
    condition: kuberay.enabled
  - name: postgresql
    version: ">=17.6.0 <19.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: milvus
    # 5.0.33 defaults to the tested Milvus 3.0.5 server image.
    version: "5.0.33"
    repository: "https://zilliztech.github.io/milvus-helm/"
    condition: milvus.enabled
  - name: vllm-stack
    alias: vllm
    version: ">=0.1.12 <1.0.0"
    repository: "https://vllm-project.github.io/production-stack"
    condition: vllm.enabled
  # Standalone monitoring. Off by default so an install next to a platform's
  # own Prometheus Operator never plants a second one. Aliased because
  # vllm-stack carries its own (disabled) kube-prometheus-stack, and two
  # sub-charts of one name make Helm coalesce one's defaults into the other.
  - name: kube-prometheus-stack
    alias: kubePrometheusStack
    version: "91.4.1"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: monitoring.bundled
