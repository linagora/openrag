{{- if .Values.ray.enabled }}
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: {{ include "openrag-stack.fullname" . }}-raycluster
  labels:
    {{- include "openrag-stack.componentLabels" (dict "component" "raycluster" "context" $) | nindent 4 }}
  {{- with .Values.ray.annotations }}
  annotations:
    {{- . | toYaml | nindent 4 }}
  {{- end }}
spec:
  rayVersion: {{ .Values.ray.rayVersion }}
  enableInTreeAutoscaling: {{ .Values.ray.enableInTreeAutoscaling }}
  headGroupSpec:
    serviceType: ClusterIP
    template:
      spec:
        {{- with .Values.ray.nodeSelector }}
        nodeSelector: {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with .Values.ray.serviceAccountName }}
        serviceAccountName: {{ tpl . $ }}
        {{- end }}
        automountServiceAccountToken: {{ include "openrag-stack.securityFieldOverride" (dict "component" .Values.ray "key" "automountServiceAccountToken" "default" .Values.security.automountServiceAccountToken) }}
        securityContext:
          {{- include "openrag-stack.mergeSecurityContext" (dict "component" .Values.ray.podSecurityContext "default" .Values.security.podSecurityContext) | nindent 10 }}
        initContainers:
          - name: init-venv-sync
            image: "{{ .Values.ray.image.registry | default .Values.global.image.registry }}/{{ .Values.ray.image.repository }}:{{ .Values.ray.image.tag }}"
            securityContext:
              {{- include "openrag-stack.mergeSecurityContext" (dict "component" (.Values.ray.containerSecurityContext | default dict) "default" .Values.security.containerSecurityContext) | nindent 14 }}
            command:
              - sh
              - -c
              - |
                # Keep venv writes group-writable (GID 0) so a later sync under a
                # different APP_UID can still remove/replace owner-only entries
                # left by a previous sync. See infra/scripts/entrypoint.sh.
                # NOTE: only fixes files written from here on — a PVC provisioned
                # before this fix still has owner-only entries and needs to be
                # recreated once after upgrading.
                umask 002
                if [ -f /app/.venv/.ready ]; then
                  echo "Existing env detected, skipping install."
                else
                  echo "No env ready, cleaning and syncing..."
                  rm -rf /app/.venv/*
                  uv sync
                  touch /app/.venv/.ready
                fi
            volumeMounts:
              - name: venv
                mountPath: /app/.venv
        containers:
          - name: ray-head
            image: "{{ .Values.ray.image.registry | default .Values.global.image.registry }}/{{ .Values.ray.image.repository }}:{{ .Values.ray.image.tag }}"
            securityContext:
              {{- include "openrag-stack.mergeSecurityContext" (dict "component" (.Values.ray.containerSecurityContext | default dict) "default" .Values.security.containerSecurityContext) | nindent 14 }}
            command: ["uv"]
            args:
              - "run"
              - "ray"
              - "start"
              - "--head"
              - "--dashboard-host={{ .Values.ray.dashboardHost }}"
              - "--dashboard-agent-listen-port=52365"
              # Kept off networkPolicy.externalPorts' 8080 (openrag/admin-ui's
              # public port) on purpose — that NetworkPolicy rule matches by
              # port number across every pod in the namespace, so reusing 8080
              # here would expose these unauthenticated Ray metrics publicly.
              - "--metrics-export-port=8090"
              - "--block"
            ports:
              - containerPort: 80
                name: ray-serve
              - containerPort: 8265
                name: ray-dashboard
              - containerPort: 10001
                name: ray-client
              - containerPort: 6379
                name: ray-gcs
              - containerPort: 8090
                name: ray-metrics
            volumeMounts:
              - name: model-weights
                mountPath: /app/model_weights
              - name: data
                mountPath: /app/data
              - name: logs
                mountPath: /app/logs
              - name: venv
                mountPath: /app/.venv
            envFrom:
              - configMapRef:
                  name: {{ include "openrag-stack.fullname" . }}-env
              - secretRef:
                  name: {{ include "openrag-stack.secretName" . }}
            {{- with .Values.ray.resources.head }}
            resources:
              {{- toYaml . | nindent 14 }}
            {{- end }}
        volumes:
          - name: model-weights
            persistentVolumeClaim:
              claimName: {{ include "openrag-stack.fullname" . }}-model-weights
          - name: data
            persistentVolumeClaim:
              claimName: {{ include "openrag-stack.fullname" . }}-data
          - name: logs
            persistentVolumeClaim:
              claimName: {{ include "openrag-stack.fullname" . }}-logs
          - name: venv
            persistentVolumeClaim:
              claimName: {{ include "openrag-stack.fullname" . }}-venv
  workerGroupSpecs:
  {{- range $i, $e := until (.Values.ray.workers.count | int) }}
    - groupName: worker-group-{{ add $i 1 }}
      replicas: {{ $.Values.ray.workers.replicas }}
      minReplicas: {{ $.Values.ray.workers.minReplicas }}
      maxReplicas: {{ $.Values.ray.workers.maxReplicas }}
      template:
        spec:
          {{- with $.Values.ray.nodeSelector }}
          nodeSelector: {{- toYaml . | nindent 14 }}
          {{- end }}
          {{- with $.Values.ray.serviceAccountName }}
          serviceAccountName: {{ tpl . $ }}
          {{- end }}
          automountServiceAccountToken: {{ include "openrag-stack.securityFieldOverride" (dict "component" $.Values.ray "key" "automountServiceAccountToken" "default" $.Values.security.automountServiceAccountToken) }}
          securityContext:
            {{- include "openrag-stack.mergeSecurityContext" (dict "component" $.Values.ray.podSecurityContext "default" $.Values.security.podSecurityContext) | nindent 12 }}
          containers:
            - name: ray-worker
              image: "{{ $.Values.ray.image.registry | default $.Values.global.image.registry }}/{{ $.Values.ray.image.repository }}:{{ $.Values.ray.image.tag }}"
              securityContext:
                {{- include "openrag-stack.mergeSecurityContext" (dict "component" ($.Values.ray.containerSecurityContext | default dict) "default" $.Values.security.containerSecurityContext) | nindent 16 }}
              command: ["/bin/bash", "-lc", "--"]
              args:
                - uv run $KUBERAY_GEN_RAY_START_CMD
              volumeMounts:
                - name: model-weights
                  mountPath: /app/model_weights
                - name: data
                  mountPath: /app/data
                - name: logs
                  mountPath: /app/logs
                - name: venv
                  mountPath: /app/.venv
              envFrom:
                - configMapRef:
                    name: {{ include "openrag-stack.fullname" $ }}-env
                - secretRef:
                    name: {{ include "openrag-stack.secretName" $ }}
              {{- with $.Values.ray.resources.worker }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
          volumes:
            - name: model-weights
              persistentVolumeClaim:
                claimName: {{ include "openrag-stack.fullname" $ }}-model-weights
            - name: data
              persistentVolumeClaim:
                claimName: {{ include "openrag-stack.fullname" $ }}-data
            - name: logs
              persistentVolumeClaim:
                claimName: {{ include "openrag-stack.fullname" $ }}-logs
            - name: venv
              persistentVolumeClaim:
                claimName: {{ include "openrag-stack.fullname" $ }}-venv
  {{- end }}
{{- if .Values.ray.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "openrag-stack.fullname" . }}-raycluster
  {{- with .Values.ray.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ray.ingress.className }}
  ingressClassName: {{ .Values.ray.ingress.className | quote }}
  {{- end }}
  rules:
    - http:
        paths:
          - path: {{ .Values.ray.ingress.path }}
            pathType: {{ .Values.ray.ingress.pathType }}
            backend:
              service:
                name: {{ include "openrag-stack.fullname" . }}-raycluster-head-svc
                port:
                  name: ray-dashboard
      host: {{ required "ray.ingress.host must be set when ray.ingress.enabled=true" .Values.ray.ingress.host | quote }}
  {{- with .Values.ray.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
