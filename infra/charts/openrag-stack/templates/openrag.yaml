{{- $rayServeEnabled := eq (toString .Values.env.config.ENABLE_RAY_SERVE) "true" -}}
{{- if and $rayServeEnabled (not .Values.ray.enabled) -}}
{{- fail "ENABLE_RAY_SERVE=true requires ray.enabled=true" -}}
{{- end -}}
{{- /* The reverse half of the same contract. With a RayCluster but neither Ray
   Serve nor a RAY_ADDRESS, the API starts its own Ray inside the openrag pod:
   the RayCluster does no work, and the Ray PodMonitor scrapes a cluster that
   holds none of the indexing metrics, so their alerts stay silent. A
   RAY_ADDRESS the chart cannot read (env.existingSecret, an external secrets
   provider) belongs in env.config as well: envFrom reads the ConfigMap first,
   so the Secret's copy still wins at runtime. */ -}}
{{- if and .Values.ray.enabled (not $rayServeEnabled) (not (include "openrag-stack.rayAddress" .)) -}}
{{- fail (printf "ray.enabled=true with neither ENABLE_RAY_SERVE=true nor a RAY_ADDRESS: the API would start its own Ray inside the openrag pod, the RayCluster would do no work, and the Ray PodMonitor would scrape a cluster holding none of the indexing metrics. Point the API at the cluster with env.config.RAY_ADDRESS: ray://%s-raycluster-head-svc:10001 (in env.config even when env.existingSecret also carries it), or set env.config.ENABLE_RAY_SERVE=true." (include "openrag-stack.fullname" .)) -}}
{{- end -}}
{{- /* With neither ray.enabled, nor a RAY_ADDRESS, nor ray.externalCluster
   (openrag-stack.embeddedRay), each openrag pod starts its own Ray: its own
   indexer workers, task state and Marker workers, sized to that pod's
   resources. */ -}}
{{- $embeddedRay := eq (include "openrag-stack.embeddedRay" .) "true" -}}
{{- if and $embeddedRay (gt (int .Values.openrag.replicas) 1) -}}
{{- fail (printf "openrag.replicas=%v with the embedded Ray (ray.enabled=false, no RAY_ADDRESS, ray.externalCluster=false): each openrag pod would run its own Ray and task state, so each pod's job reconciler marks the jobs still queued on the other pods FAILED, and cancel and the quota's pending count only see the pod that receives the request. Keep openrag.replicas: 1, or share one Ray cluster: ray.enabled=true together with env.config.RAY_ADDRESS or env.config.ENABLE_RAY_SERVE=true, or an external cluster through env.config.RAY_ADDRESS (ray.externalCluster=true when RAY_ADDRESS comes from a Secret the chart cannot read)." .Values.openrag.replicas) -}}
{{- end -}}
{{- /* Every Marker, Docling and Whisper worker reserves its *_NUM_GPUS of the
   Ray node it runs on. With the embedded Ray that node is this pod, so a worker
   that does not fit never starts, and the files sent to it fail after the
   parser's timeout. Any preset can select Marker or Docling at runtime,
   whatever PDFLOADER says, and Whisper is the default loader for audio, so all
   three are counted. Ray puts a fractional reservation on a single GPU and a
   reservation of 1 or more on whole GPUs, so the workers are placed card by
   card (first fit), not summed. The pools start lazily, in whatever order
   files first need them, so the workers must fit in every order the three
   pools can start in. Without a GPU in the pod the reservations
   are dropped (marker_workers._marker_num_gpus and its Docling and Whisper
   twins). env.secrets is read too: envFrom loads it after the ConfigMap, so its
   copy wins. The defaults are the app's (conf/config.yaml). */ -}}
{{- if $embeddedRay -}}
{{- $resources := .Values.openrag.resources | default dict -}}
{{- $podGpus := int (dig "limits" "nvidia.com/gpu" (dig "requests" "nvidia.com/gpu" 0 $resources) $resources) -}}
{{- if gt $podGpus 0 -}}
{{- $env := mergeOverwrite (deepCopy (.Values.env.config | default dict)) (.Values.env.secrets | default dict) -}}
{{- $pools := list
  (dict "name" "Marker" "poolKey" "MARKER_POOL_SIZE" "gpusKey" "MARKER_NUM_GPUS" "count" (int (dig "MARKER_POOL_SIZE" "1" $env)) "size" (float64 (dig "MARKER_NUM_GPUS" "0.01" $env)))
  (dict "name" "Docling" "poolKey" "DOCLING_POOL_SIZE" "gpusKey" "DOCLING_NUM_GPUS" "count" (int (dig "DOCLING_POOL_SIZE" "1" $env)) "size" (float64 (dig "DOCLING_NUM_GPUS" "0.01" $env)))
  (dict "name" "Whisper" "poolKey" "WHISPER_N_WORKERS" "gpusKey" "WHISPER_NUM_GPUS" "count" (int (dig "WHISPER_N_WORKERS" "2" $env)) "size" (float64 (dig "WHISPER_NUM_GPUS" "0.01" $env)))
-}}
{{- $summary := list -}}
{{- range $pool := $pools -}}
{{- $summary = append $summary (printf "%s %v x %v" $pool.name $pool.count $pool.size) -}}
{{- if and (gt $pool.size 1.0) (ne $pool.size (floor $pool.size)) -}}
{{- fail (printf "%s=%v: Ray accepts a GPU reservation above 1 only as a whole number, so the %s workers would never start. Use a whole number, or a fraction of one GPU." $pool.gpusKey $pool.size $pool.name) -}}
{{- end -}}
{{- end -}}
{{- range $order := list (list 0 1 2) (list 0 2 1) (list 1 0 2) (list 1 2 0) (list 2 0 1) (list 2 1 0) -}}
{{- $startOrder := list -}}
{{- range $i := $order -}}{{- $startOrder = append $startOrder (index $pools $i).name -}}{{- end -}}
{{- $free := dict -}}
{{- range $card := until $podGpus -}}{{- $_ := set $free (toString $card) 1.0 -}}{{- end -}}
{{- range $i := $order -}}
{{- $pool := index $pools $i -}}
{{- if gt $pool.size 0.0 -}}
{{- range $_ := until $pool.count -}}
{{- $placed := false -}}
{{- if ge $pool.size 1.0 -}}
{{- $whole := list -}}
{{- range $card := until $podGpus -}}
{{- if and (lt (len $whole) (int $pool.size)) (ge (index $free (toString $card)) 0.999999) -}}{{- $whole = append $whole (toString $card) -}}{{- end -}}
{{- end -}}
{{- if eq (len $whole) (int $pool.size) -}}
{{- range $card := $whole -}}{{- $_ := set $free $card 0.0 -}}{{- end -}}
{{- $placed = true -}}
{{- end -}}
{{- else -}}
{{- range $card := until $podGpus -}}
{{- if and (not $placed) (ge (index $free (toString $card)) (subf $pool.size 0.000001)) -}}
{{- $_ := set $free (toString $card) (subf (index $free (toString $card)) $pool.size) -}}
{{- $placed = true -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if not $placed -}}
{{- fail (printf "The GPU workers do not fit the openrag pod's %d GPU(s), which runs the embedded Ray: %s. Ray puts a fractional reservation on a single GPU and a reservation of 1 or more on whole GPUs, so if the pools start in the order %s, a %s worker never starts, and the files sent to it fail after the parser's timeout. Lower %s or %s (or those of the other workers), or give the pod more GPUs." $podGpus (join ", " $summary) (join ", " $startOrder) $pool.name $pool.poolKey $pool.gpusKey) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openrag-stack.fullname" . }}-openrag
  labels:
    {{- include "openrag-stack.componentLabels" (dict "component" "openrag" "context" $) | nindent 4 }}
spec:
  replicas: {{ .Values.openrag.replicas }}
  {{- if $embeddedRay }}
  # A rolling update would run the new pod beside the old one, each with its own
  # Ray: the new pod's job reconciler marks the old pod's queued jobs FAILED,
  # for good. Stop the old pod first.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "openrag-stack.componentSelectorLabels" (dict "component" "openrag" "context" $) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-env.yaml") . | sha256sum }}
        {{- /* Not under Ray Serve: this pod's 8080 is then the serve driver,
           not the API (see templates/servicemonitor.yaml). */}}
        {{- if and .Values.openrag.metrics.prometheusAnnotations (ne (include "openrag-stack.rayServeApi" .) "true") }}
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: {{ .Values.openrag.service.targetPort | quote }}
        {{- end }}
      labels:
        {{- include "openrag-stack.componentSelectorLabels" (dict "component" "openrag" "context" $) | nindent 8 }}
    spec:
      securityContext:
        {{- include "openrag-stack.mergeSecurityContext" (dict "component" .Values.openrag.podSecurityContext "default" .Values.security.podSecurityContext) | nindent 8 }}
      {{- with .Values.openrag.serviceAccountName }}
      serviceAccountName: {{ tpl . $ }}
      {{- end }}
      automountServiceAccountToken: {{ include "openrag-stack.securityFieldOverride" (dict "component" .Values.openrag "key" "automountServiceAccountToken" "default" .Values.security.automountServiceAccountToken) }}
      {{- if or .Values.openrag.extraInitContainers .Values.ray.enabled }}
      initContainers:
        {{- with .Values.openrag.extraInitContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.ray.enabled }}
        - name: init-venv
          image: "{{ .Values.openrag.image.registry | default .Values.global.image.registry }}/{{ .Values.openrag.image.repository }}:{{ .Values.openrag.image.tag }}"
          securityContext:
            {{- include "openrag-stack.mergeSecurityContext" (dict "component" (.Values.openrag.containerSecurityContext | default dict) "default" .Values.security.containerSecurityContext) | nindent 12 }}
          command:
            - sh
            - -c
            - |
              echo "Waiting for Python env in /app/.venv..."
              while [ ! -f /app/.venv/.ready ]; do
                sleep 3
              done
              echo "Venv is ready."
          volumeMounts:
            - name: venv
              mountPath: /app/.venv
        {{- end }}
      {{- end }}
      containers:
        - name: openrag
          image: "{{ .Values.openrag.image.registry | default .Values.global.image.registry }}/{{ .Values.openrag.image.repository }}:{{ .Values.openrag.image.tag }}"
          imagePullPolicy: {{ .Values.openrag.image.pullPolicy }}
          securityContext:
            {{- include "openrag-stack.mergeSecurityContext" (dict "component" (.Values.openrag.containerSecurityContext | default dict) "default" .Values.security.containerSecurityContext) | nindent 12 }}
          ports:
            - containerPort: {{ .Values.openrag.service.targetPort }}
              name: openrag
            {{- if .Values.openrag.rayDashboard.ingress.enabled }}
            - containerPort: 8265
              name: ray-dashboard
            {{- end }}
            {{- if eq (include "openrag-stack.embeddedRay" .) "true" }}
            {{- /* The embedded Ray's metrics agent. Unpinned it takes a random
               port, and nothing can scrape the indexing and worker-side
               inference series recorded in Ray actors. */}}
            - containerPort: {{ include "openrag-stack.rayMetricsPort" . }}
              name: ray-metrics
            {{- end }}
          resources:
            {{- toYaml .Values.openrag.resources | nindent 12 }}
          {{- if .Values.openrag.probes.startup }}
          {{- /* /health_check, like the HTTP probe in values: a startup probe that
             fails restarts the container, and with READINESS_REQUIRE_EMBEDDER=true
             /ready also fails while the default embedder is down (#1099),
             which a restart cannot fix. */}}
          startupProbe:
            {{- include "openrag-stack.openragProbe" (dict "probe" .Values.openrag.probes.startup "rayServe" $rayServeEnabled "path" "/health_check" "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.openrag.probes.readiness }}
          readinessProbe:
            {{- include "openrag-stack.openragProbe" (dict "probe" .Values.openrag.probes.readiness "rayServe" $rayServeEnabled "path" "/ready" "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.openrag.probes.liveness }}
          livenessProbe:
            {{- include "openrag-stack.openragProbe" (dict "probe" .Values.openrag.probes.liveness "rayServe" $rayServeEnabled "path" "/health_check" "context" $) | nindent 12 }}
          {{- end }}
          {{- if eq (include "openrag-stack.embeddedRay" .) "true" }}
          env:
            - name: RAY_METRICS_EXPORT_PORT
              value: {{ include "openrag-stack.rayMetricsPort" . | quote }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "openrag-stack.fullname" . }}-env
            - secretRef:
                name: {{ include "openrag-stack.secretName" . }}
          volumeMounts:
            - name: model-weights
              mountPath: /app/model_weights
            - name: data
              mountPath: /app/data
            - name: venv
              mountPath: /app/.venv
            {{- if .Values.openrag.shmSize }}
            - name: dshm
              mountPath: /dev/shm
            {{- end }}
            {{- with .Values.openrag.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: model-weights
          persistentVolumeClaim:
            claimName: {{ include "openrag-stack.fullname" . }}-model-weights
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "openrag-stack.fullname" . }}-data
        - name: venv
          persistentVolumeClaim:
            claimName: {{ include "openrag-stack.fullname" . }}-venv
        {{- if .Values.openrag.shmSize }}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.openrag.shmSize }}
        {{- end }}
        {{- with .Values.openrag.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openrag-stack.fullname" . }}-openrag
  labels:
    {{- include "openrag-stack.componentLabels" (dict "component" "openrag" "context" $) | nindent 4 }}
spec:
  selector:
    {{- include "openrag-stack.componentSelectorLabels" (dict "component" "openrag" "context" $) | nindent 4 }}
  ports:
    - name: openrag
      protocol: TCP
      port: {{ .Values.openrag.service.port }}
      targetPort: {{ .Values.openrag.service.targetPort }}
    {{- if .Values.openrag.rayDashboard.ingress.enabled }}
    - name: ray-dashboard
      protocol: TCP
      port: 8265
      targetPort: 8265
    {{- end }}
  type: {{ .Values.openrag.service.type }}
{{- if .Values.openrag.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "openrag-stack.fullname" . }}-openrag
  {{- with .Values.openrag.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.openrag.ingress.className }}
  ingressClassName: {{ .Values.openrag.ingress.className | quote }}
  {{- end }}
  rules:
    - http:
        paths:
          {{- if .Values.adminUi.ingress.enabled }}
          - path: /app/
            pathType: Prefix
            backend:
              service:
                name: {{ include "openrag-stack.fullname" . }}-admin-ui
                port:
                  name: admin-ui
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                {{- /* raycluster-head-svc only exists when ray.enabled renders the
                   RayCluster (templates/raycluster.yaml) — ENABLE_RAY_SERVE alone
                   isn't enough, otherwise this Ingress can dangle at a Service
                   that was never created. */}}
                {{- if eq (include "openrag-stack.rayServeApi" .) "true" }}
                name: {{ include "openrag-stack.fullname" . }}-raycluster-head-svc
                port:
                  name: ray-serve
                {{- else }}
                name: {{ include "openrag-stack.fullname" . }}-openrag
                port:
                  name: openrag
                {{- end }}
      host: {{ required "openrag.ingress.host must be set when openrag.ingress.enabled=true" .Values.openrag.ingress.host | quote }}
  {{- with .Values.openrag.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.openrag.rayDashboard.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "openrag-stack.fullname" . }}-openrag-ray-dashboard
  {{- with .Values.openrag.rayDashboard.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.openrag.rayDashboard.ingress.className }}
  ingressClassName: {{ .Values.openrag.rayDashboard.ingress.className | quote }}
  {{- end }}
  rules:
    - http:
        paths:
          - path: {{ .Values.openrag.rayDashboard.ingress.path }}
            pathType: {{ .Values.openrag.rayDashboard.ingress.pathType }}
            backend:
              service:
                name: {{ include "openrag-stack.fullname" . }}-openrag
                port:
                  name: ray-dashboard
      host: {{ required "openrag.rayDashboard.ingress.host must be set when openrag.rayDashboard.ingress.enabled=true" .Values.openrag.rayDashboard.ingress.host | quote }}
  {{- with .Values.openrag.rayDashboard.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
