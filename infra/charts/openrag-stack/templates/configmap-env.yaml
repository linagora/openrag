apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openrag-stack.fullname" . }}-env
data:
{{- range $key, $value := .Values.env.config }}
  {{ $key }}: "{{ tpl (printf "%v" $value) $ }}"
{{- end }}
{{- if and .Values.ray.enabled (not (hasKey .Values.env.config "RAY_LOG_TO_STDERR")) }}
  # Workers run in the Ray pods. Ray's driver-side relay only carries lines
  # from actors created by the current driver job, so the detached worker
  # actors go silent for the API after its first restart; with this flag the
  # workers write to their own pod's stderr and the DaemonSet ships them with
  # the Ray pods' labels (the "(Actor pid=N)" prefix is not added on this path).
  # Set env.config.RAY_LOG_TO_STDERR yourself to override.
  RAY_LOG_TO_STDERR: "1"
{{- end }}
{{- with .Values.openrag.seedUsers }}
{{- if hasKey $.Values.env.config "SEED_USERS" }}
{{- fail "openrag.seedUsers is set and env.config also defines SEED_USERS: keep one of the two." }}
{{- end }}
{{- /* Only the documented keys reach the ConfigMap: anything else could be a
     secret. Errors name the entry by index and the key, never a value. */}}
{{- $hint := "Tokens never go here: put the token in the chart's Secret and name its env var in token_env." }}
{{- $seedKeys := list "external_user_id" "display_name" "token_env" "is_admin" "partitions" }}
{{- range $i, $seed := . }}
{{- if not (kindIs "map" $seed) }}
{{- fail (printf "openrag.seedUsers[%d] must be a map. %s" $i $hint) }}
{{- end }}
{{- range $key, $_ := $seed }}
{{- if not (has $key $seedKeys) }}
{{- fail (printf "openrag.seedUsers[%d] has unsupported key %q (allowed: %s). %s" $i $key (join ", " $seedKeys) $hint) }}
{{- end }}
{{- end }}
{{- if hasKey $seed "partitions" }}
{{- if not (kindIs "slice" $seed.partitions) }}
{{- fail (printf "openrag.seedUsers[%d].partitions must be a list. %s" $i $hint) }}
{{- end }}
{{- range $j, $membership := $seed.partitions }}
{{- if not (kindIs "map" $membership) }}
{{- fail (printf "openrag.seedUsers[%d].partitions[%d] must be a map. %s" $i $j $hint) }}
{{- end }}
{{- range $key, $_ := $membership }}
{{- if not (has $key (list "name" "role")) }}
{{- fail (printf "openrag.seedUsers[%d].partitions[%d] has unsupported key %q (allowed: name, role). %s" $i $j $key $hint) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
  # auth.seed_users (openrag.seedUsers): env var names only, no token.
  SEED_USERS: {{ toJson . | quote }}
{{- end }}
{{- if .Values.proxy.enabled }}
{{- if or (empty .Values.proxy.url) (eq .Values.proxy.url "http://192.168.100.100:80") }}
{{- fail "proxy.enabled is true but proxy.url is not set or still uses the placeholder default. Set a valid proxy URL in proxy.url." }}
{{- end }}
{{- $proxyKeys := list "HTTP_PROXY" "HTTPS_PROXY" "http_proxy" "https_proxy" "NO_PROXY" "no_proxy" }}
{{- range $proxyKeys }}
{{- if hasKey $.Values.env.config . }}
{{- fail (printf "proxy.enabled is true but env.config already defines %q — remove it from env.config to avoid a duplicate ConfigMap key." .) }}
{{- end }}
{{- end }}
  HTTP_PROXY: {{ .Values.proxy.url | quote }}
  HTTPS_PROXY: {{ .Values.proxy.url | quote }}
  http_proxy: {{ .Values.proxy.url | quote }}
  https_proxy: {{ .Values.proxy.url | quote }}
  NO_PROXY: {{ .Values.proxy.noProxy | quote }}
  no_proxy: {{ .Values.proxy.noProxy | quote }}
{{- end }}
