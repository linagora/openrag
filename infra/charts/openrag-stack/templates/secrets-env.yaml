{{- $secretName := include "openrag-stack.secretName" . }}
{{- $type := .Values.env.secretsProvider.type | default "values" }}
{{- if not .Values.env.existingSecret }}

{{- if eq $type "values" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels: {{- include "openrag-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- /* Kept in lockstep with openrag/core/config/secrets_guard.py, which enforces
   the same policy at runtime — the chart can only validate the `values` branch
   below, so the two together are what cover an install. A unit test
   (tests/unit/core/config/test_secrets_guard.py) fails the build if these lists
   and the Python ones disagree; edit both or neither. */}}
{{- $requiredSecrets := list "AUTH_TOKEN" "POSTGRES_PASSWORD" }}
{{- /* Lower-cased so the comparison below can be case-insensitive with a plain
   `has`: a copied value is a copy whatever its casing. The Python set is
   stored casefolded for the same reason, which is what makes them comparable. */}}
{{- $placeholderSecrets := list
      "or-openrag-1234" "sk-openrag-1234" "openrag-dev-secret" "minioadmin" "postgres"
      "replace-with-a-strong-password" "sk-xxxx" "hf_xxxx" "change_me_strong_password"
      "root_password" "sk-or-change-me" "change-me-the-secret-from-step-1"
      "your_secret_value" "your-api-key" "xxxxxxxxxxxxxxxxxxxxxxxx" "test-admin-token"
      "__generate_me__" }}
{{- /* Credentials whose format this project defines, so a length floor is ours
   to set. Upstream API keys are excluded: their length belongs to the provider,
   and "EMPTY" is the documented way to say an endpoint needs no credential. */}}
{{- $lengthCheckedSecrets := list "AUTH_TOKEN" "POSTGRES_PASSWORD" "CHAINLIT_AUTH_SECRET" "MINIO_SECRET_KEY" "GRAFANA_ADMIN_PASSWORD" }}
{{- $minSecretLength := 12 }}
{{- $secrets := .Values.env.secrets | default dict }}
{{- range $requiredKey := $requiredSecrets }}
  {{- if not (hasKey $secrets $requiredKey) }}
  {{- fail (printf "env.secrets.%s must be set before installing the chart" $requiredKey) }}
  {{- end }}
{{- end }}
{{- range $key, $rawValue := $secrets }}
  {{- $stringValue := "" }}
  {{- /* postgresql.auth.password is the actual credential Postgres enforces —
     read it live here instead of trusting env.secrets.POSTGRES_PASSWORD's YAML
     anchor, which only resolves within values.yaml itself and goes stale the
     moment postgresql.auth.password is overridden via --set/-f (anchors don't
     survive Helm's values merge). Falls back to the literal for external
     Postgres (postgresql.enabled=false), where this key is set directly. */}}
  {{- if and (eq $key "POSTGRES_PASSWORD") $.Values.postgresql.enabled }}
  {{- $stringValue = printf "%v" $.Values.postgresql.auth.password }}
  {{- else }}
  {{- $stringValue = tpl (printf "%v" $rawValue) $ }}
  {{- end }}
  {{- if has $key $requiredSecrets }}
    {{- if empty $stringValue }}
    {{- fail (printf "env.secrets.%s must be set before installing the chart" $key) }}
    {{- end }}
  {{- end }}
  {{- if has (lower (trim $stringValue)) $placeholderSecrets }}
  {{- fail (printf "env.secrets.%s is set to a value published by this project as an example or development default; supply a generated value" $key) }}
  {{- end }}
  {{- /* Trimmed, and blank reads as unset, so this matches the runtime guard
     exactly: requiredness is the check above's job, and an optional secret
     left blank is not a length failure. */}}
  {{- if and (not (empty (trim $stringValue))) (has $key $lengthCheckedSecrets) (lt (len (trim $stringValue)) $minSecretLength) }}
  {{- fail (printf "env.secrets.%s is shorter than %d characters; supply a generated value" $key $minSecretLength) }}
  {{- end }}
  {{ $key }}: {{ $stringValue | quote }}
{{- end }}

{{- else if eq $type "externalSecret" }}
---
# Requires External Secrets Operator >= 0.14 (first release that serves external-secrets.io/v1).
# On older installs only v1beta1 is available — pin apiVersion accordingly or upgrade the operator.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  labels: {{- include "openrag-stack.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.env.secretsProvider.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.env.secretsProvider.externalSecret.secretStore.name | quote }}
    kind: {{ .Values.env.secretsProvider.externalSecret.secretStore.kind | quote }}
  target:
    name: {{ $secretName }}
    creationPolicy: Owner
  {{- if .Values.env.secretsProvider.externalSecret.dataFrom }}
  dataFrom:
    {{- toYaml .Values.env.secretsProvider.externalSecret.dataFrom | nindent 4 }}
  {{- else if .Values.env.secretsProvider.externalSecret.data }}
  data:
    {{- toYaml .Values.env.secretsProvider.externalSecret.data | nindent 4 }}
  {{- else }}
  {{- fail "externalSecret requires either dataFrom or data to be set" }}
  {{- end }}

{{- else if eq $type "vaultStaticSecret" }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ $secretName }}
  labels: {{- include "openrag-stack.labels" . | nindent 4 }}
spec:
  type: {{ .Values.env.secretsProvider.vaultStaticSecret.type | quote }}
  mount: {{ .Values.env.secretsProvider.vaultStaticSecret.mount | quote }}
  path: {{ .Values.env.secretsProvider.vaultStaticSecret.path | quote }}
  {{- if .Values.env.secretsProvider.vaultStaticSecret.vaultAuthRef }}
  vaultAuthRef: {{ .Values.env.secretsProvider.vaultStaticSecret.vaultAuthRef | quote }}
  {{- end }}
  refreshAfter: {{ .Values.env.secretsProvider.vaultStaticSecret.refreshAfter | quote }}
  hmacSecretData: {{ .Values.env.secretsProvider.vaultStaticSecret.hmacSecretData }}
  destination:
    create: true
    name: {{ $secretName }}
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ include "openrag-stack.fullname" . }}-openrag
    {{- if .Values.adminUi.enabled }}
    - kind: Deployment
      name: {{ include "openrag-stack.fullname" . }}-admin-ui
    {{- end }}
    # Note: the Ray head and workers also mount this secret via secretRef but
    # VSO rolloutRestartTargets only supports Deployment/StatefulSet/DaemonSet —
    # RayCluster pods managed by KubeRay must be cycled manually after rotation.

{{- else }}
{{- fail (printf "invalid env.secretsProvider.type: %q (accepted values: values, externalSecret, vaultStaticSecret)" $type) }}
{{- end }}
{{- end }}
