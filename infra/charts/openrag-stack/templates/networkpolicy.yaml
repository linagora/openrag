{{- if .Values.networkPolicy.enabled }}
# Default-deny ingress baseline: applies to every pod in the namespace
# (podSelector: {}). Two allowances:
#   1. any pod in the same namespace (intra-stack traffic), and
#   2. the public HTTP ports, reachable from anywhere (Ingress controller).
# Everything else — notably the unauthenticated Ray dashboard (8265), GCS
# (6379), Ray client (10001), Postgres and Milvus — is only reachable from
# within the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openrag-stack.fullname" . }}-default-deny
  labels:
    {{- include "openrag-stack.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # 1. Allow all traffic originating from pods in this namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
    # 2. Allow the public HTTP ports from any source (e.g. the Ingress controller).
    {{- with .Values.networkPolicy.externalPorts }}
    - ports:
        {{- range . }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
{{- end }}
{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.acmeHttp01.enabled }}
{{- /* cert-manager answers an HTTP-01 challenge from a solver pod it starts in
   this namespace, listening on 8089, and the request arrives through the
   Ingress controller, from outside it: the default-deny policy above drops it,
   and the Certificate never becomes Ready. This opens 8089 on the solver pods
   alone, selected by the label cert-manager gives them. Rendered whatever the
   ingress TLS settings, since the certificate may be requested elsewhere (a
   Certificate object, another Ingress): with no challenge pending it selects
   no pod. Any source by default, because a host-network Ingress controller
   (k3s's Traefik, for one) connects from a node address that no
   namespaceSelector matches; networkPolicy.acmeHttp01.from narrows it. */}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openrag-stack.fullname" . }}-acme-http01-solver
  labels:
    {{- include "openrag-stack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8089
          protocol: TCP
      {{- with .Values.networkPolicy.acmeHttp01.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- if and .Values.networkPolicy.enabled .Values.monitoring.bundled }}
{{- /* The Prometheus Operator's admission webhook validates PrometheusRule and
   AlertmanagerConfig objects before they are stored, and its caller is the API
   server: not a pod, and on a managed control plane not on the cluster network
   at all, so neither a podSelector nor a namespaceSelector can name it. The
   default-deny policy above admits this namespace and the public HTTP ports
   only, which leaves the call dropped wherever the API server is off-node —
   silently skipping validation under kube-prometheus-stack's default
   failurePolicy (Ignore), and rejecting every write of those objects under
   Fail. This opens the webhook port alone, on the one pod that serves it. */}}
{{- /* Round-tripped because `dig` takes a plain map, and Helm's values are not one. */}}
{{- $stack := .Values.kubePrometheusStack | toYaml | fromYaml }}
{{- $operator := dig "prometheusOperator" dict $stack }}
{{- if and (dig "enabled" true $operator) (dig "admissionWebhooks" "enabled" true $operator) }}
{{- $kps := dig "nameOverride" "kube-prometheus-stack" $stack }}
{{- /* The webhook's own deployment (this chart's default) serves the webhook,
   /metrics and /healthz. Without it the Prometheus Operator serves the webhook
   on its own listener, which also carries /debug/pprof/: turning the
   deployment off is an explicit choice, and networkPolicy.webhookFrom is the
   way to narrow what it opens. */}}
{{- $separate := dig "admissionWebhooks" "deployment" "enabled" false $operator }}
{{- $app := ternary (printf "%s-operator-webhook" $kps) (printf "%s-operator" $kps) $separate }}
{{- $port := ternary (dig "admissionWebhooks" "deployment" "tls" "internalPort" 10250 $operator) (dig "tls" "internalPort" 10250 $operator) $separate }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openrag-stack.fullname" . }}-monitoring-webhook
  labels:
    {{- include "openrag-stack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ $app }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ $port }}
          protocol: TCP
      {{- with .Values.networkPolicy.webhookFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
