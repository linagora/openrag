{{- $rayServe := eq (include "openrag-stack.rayServeApi" .) "true" }}
{{- /* monitoring.bundled turns the monitor on for the uvicorn topology only: under
   Ray Serve there is no single target to give it (see below), and NOTES.txt
   says so instead of failing an install that did not ask for the monitor. */}}
{{- $bundled := and .Values.monitoring.bundled (not $rayServe) }}
{{- if or .Values.openrag.metrics.serviceMonitor.enabled $bundled }}
{{- if $rayServe }}
{{- /* Under Ray Serve the API listens on the RayCluster head Service (port
   ray-serve), not on the openrag Service:8080 this monitor targets, and each
   Serve replica keeps its own metrics registry behind one load-balancing
   proxy — a scrape would return a random replica's counters. Refuse rather
   than render a target that scrapes nothing. */}}
{{- fail "openrag.metrics.serviceMonitor is not supported with ray.enabled=true and ENABLE_RAY_SERVE=true: the API is served by Ray Serve replicas (per-replica metric registries behind the head Service), not by the openrag Service this ServiceMonitor targets. Disable the ServiceMonitor, or run the uvicorn topology. See docs/documentation/prometheus_metrics.md, Limitations." }}
{{- end }}
{{- /* The bundled Prometheus always sends the bearer, as the Compose overlay
   does, so it needs the token for the same reason the overlay refuses to start
   without it: GET /metrics fails closed, and a monitor scraping a 403 forever
   looks like a target that is merely down. Only the chart-rendered Secret can
   be checked here; with env.existingSecret or an external provider, that
   Secret must carry the key. */}}
{{- $bearer := or .Values.openrag.metrics.serviceMonitor.bearerTokenFromSecret $bundled }}
{{- if and $bundled (not .Values.env.existingSecret) (eq (.Values.env.secretsProvider.type | default "values") "values") }}
{{- if empty (trim (toString (index (.Values.env.secrets | default dict) "METRICS_TOKEN" | default ""))) }}
{{- fail "monitoring.bundled scrapes GET /metrics with env.secrets.METRICS_TOKEN as the bearer, and it is empty: set it (e.g. `openssl rand -hex 16`). See docs/documentation/kubernetes.md, Monitoring." }}
{{- end }}
{{- end }}
# Prometheus Operator discovery of the API's GET /metrics (same port as the
# API — there is no dedicated metrics port). Requires the monitoring.coreos.com
# CRDs (kube-prometheus-stack or a standalone operator) to be installed first.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "openrag-stack.fullname" . }}-openrag
  labels:
    {{- include "openrag-stack.componentLabels" (dict "component" "openrag" "context" $) | nindent 4 }}
    {{- with .Values.openrag.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "openrag-stack.componentSelectorLabels" (dict "component" "openrag" "context" $) | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: openrag
      path: /metrics
      interval: {{ .Values.openrag.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.openrag.metrics.serviceMonitor.scrapeTimeout }}
      {{- if $bearer }}
      authorization:
        type: Bearer
        credentials:
          name: {{ include "openrag-stack.secretName" . }}
          key: METRICS_TOKEN
      {{- end }}
{{- end }}
