{{- if .Values.monitoring.prometheusRule.enabled }}
{{- /*
Alert rules for the Prometheus Operator. The groups come verbatim from
rules/openrag-alerts.yaml so Compose and Kubernetes alert on one rule set
rather than two that drift; .Files.Get cannot read outside the chart
directory, which is why the file lives there.

Requires the monitoring.coreos.com CRDs (kube-prometheus-stack or a standalone
operator). Disabled by default, like the ServiceMonitor.
*/}}
{{- $rules := .Files.Get "rules/openrag-alerts.yaml" }}
{{- with .Values.monitoring.prometheusRule.runbookBaseUrl }}
{{- $rules = replace "https://github.com/linagora/openrag/blob/main/docs/deployment/runbooks" . $rules }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "openrag-stack.fullname" . }}-alerts
  labels:
    {{- include "openrag-stack.labels" . | nindent 4 }}
    {{- /* The label the operator's ruleSelector matches on, e.g.
       release: kube-prometheus-stack. Without it the rules are created and
       never loaded, which looks exactly like a healthy system. */}}
    {{- with .Values.monitoring.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
{{- if .Values.monitoring.prometheusRule.commonLabels }}
{{- /* Stamp deployment-wide routing labels onto every alert, so they match the
   Alertmanager conventions of whichever stack is running. A rule whose labels
   miss those conventions fires into a void indistinguishable from silence.
   A rule's own labels win on conflict: severity is the rule's to decide. */}}
{{- $parsed := $rules | fromYaml }}
{{- $common := .Values.monitoring.prometheusRule.commonLabels }}
{{- range $group := $parsed.groups }}
{{- range $rule := $group.rules }}
{{- $_ := set $rule "labels" (merge ($rule.labels | default dict) $common) }}
{{- end }}
{{- end }}
  {{- toYaml $parsed | nindent 2 }}
{{- else }}
{{- /* No routing labels to inject: pass the file through untouched, which keeps
   its comments in `helm get manifest` for whoever is reading it at 3am. */}}
{{- $rules | nindent 2 }}
{{- end }}
{{- end }}
