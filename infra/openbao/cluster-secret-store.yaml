# External Secrets Operator store for OpenBao (the `vault` provider — OpenBao
# keeps Vault's API). Referenced by name from
# infra/charts/openrag-stack/values-openbao.yaml.
#
# Requires ESO >= 0.14 (external-secrets.io/v1). ESO authenticates with the
# Kubernetes auth method: it requests a token for the ServiceAccount below and
# trades it for an OpenBao token bound to the `openrag` role, so no OpenBao
# credential is stored in the cluster.
#
# OpenBao side (once, in your namespace):
#   bao auth enable kubernetes
#   bao write auth/kubernetes/config kubernetes_host=https://<api-server>
#   bao policy write openrag-read infra/openbao/policy.hcl
#   bao write auth/kubernetes/role/openrag \
#     bound_service_account_names=openrag-secrets-reader \
#     bound_service_account_namespaces=openrag \
#     policies=openrag-read ttl=1h
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openrag-secrets-reader
  namespace: openrag
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: "https://poc-obao.linagora.com"
      # OpenBao namespace (team-manager gives each team one).
      namespace: "openrag"
      # KV v2 mount. ExternalSecret keys are relative to it:
      # `openrag/staging` -> secret/data/openrag/staging
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "openrag"
          serviceAccountRef:
            name: "openrag-secrets-reader"
            namespace: "openrag"
      # Private CA? Reference a ConfigMap/Secret holding the bundle instead of
      # disabling verification:
      # caProvider:
      #   type: ConfigMap
      #   name: openbao-ca
      #   key: ca.crt
      #   namespace: openrag
