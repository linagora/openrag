# Opt-in TLS front door (Nginx Proxy Manager). Layer it on the base stack:
#
#   docker compose -f docker-compose.yaml -f proxy.docker-compose.yaml up -d
#
# Terminates TLS on 80/443. Route by path in NPM's proxy host for your domain:
#   /app  -> admin-ui:8080   (React SPA; prefix preserved, NOT stripped)
#   /     -> openrag:8080    (API, /auth, /v1 and the Chainlit UI at /chainlit;
#                             APP_iPORT instead of 8080 if you set it)
#
# `/` deliberately bypasses admin-ui's own catch-all proxy, saving a hop on
# every API call. NPM only forwards the Upgrade/Connection headers Chainlit's
# WebSocket needs when "Websockets Support" is on for the proxy host.
#
# Also set UVICORN_FORWARDED_ALLOW_IPS=172.16.0.0/12 (Docker's default range
# for Compose networks) in .env: NPM reaches the API from this project's
# network, not from loopback, so without it uvicorn drops X-Forwarded-For/-Proto.
# Full walkthrough: docs, "Reverse proxy (TLS)".
#
# An overlay rather than a profile: the API service declares `profiles: [""]`,
# and passing any explicit --profile deselects that default profile — a
# `--profile proxy` would start the front door with no backend behind it.

services:
  nginx:
    image: jc21/nginx-proxy-manager:2.16.0
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # NPM's own admin UI — loopback only; reach it via an SSH tunnel
      # (`ssh -L 81:127.0.0.1:81 host`, then http://localhost:81).
      - "127.0.0.1:81:81"
    volumes:
      # NPM's state (config + database.sqlite) and its Let's Encrypt certs.
      # Relative paths resolve against THIS file's directory (infra/compose/),
      # so the defaults land at the repo root.
      - ${PROXY_DATA_DIR:-../../nginx_data}:/data
      - ${PROXY_LETSENCRYPT_DIR:-../../letsencrypt}:/etc/letsencrypt
    # TLS session settings for every proxy host (see `configs` below). NPM
    # includes /etc/nginx/conf.d/*.conf inside `http {}`.
    configs:
      - source: npm_tls_sessions
        target: /etc/nginx/conf.d/openrag-tls-sessions.conf

  # With TLS terminated here, the app ports must not stay on 0.0.0.0: that
  # would offer a plaintext path around TLS and the OIDC redirect (and, for
  # admin-ui, its catch-all reverse proxy to the API). Rebind every port the
  # base file publishes to loopback; services from the *_COMPOSE includes keep
  # their own bindings.
  # `!override` replaces the base list instead of appending to it (Compose
  # merges `ports` entries, so a plain list would publish both bindings and
  # collide on the host port); it needs Docker Compose >= 2.24.4.
  openrag:
    ports: !override
      - 127.0.0.1:${APP_PORT:-8080}:${APP_iPORT:-8080}
      - 127.0.0.1:${CHAINLIT_PORT:-8090}:${CHAINLIT_PORT:-8090}

  openrag-cpu:
    ports: !override
      - 127.0.0.1:${APP_PORT:-8080}:${APP_iPORT:-8080}
      - 127.0.0.1:${CHAINLIT_PORT:-8090}:${CHAINLIT_PORT:-8090}

  admin-ui:
    ports: !override
      - "127.0.0.1:${ADMIN_UI_PORT:-8081}:8080"

configs:
  # Resume TLS sessions from the server-side cache rather than from session
  # tickets, as Mozilla's server-side TLS guidelines recommend: a ticket key
  # can decrypt every session it issued for as long as it lives. NPM only sets
  # ssl_session_cache inside hosts with a Let's Encrypt certificate, but under
  # SNI nginx resumes from the default server's cache, so tickets off without
  # an http-level cache would stop resumption altogether.
  # Those hosts include NPM's own conf.d/include/ssl-cache.conf, so the cache
  # line must match it: nginx refuses to start when the `SSL` zone is declared
  # with two sizes. Hosts with a custom certificate don't include it and
  # inherit this cache. Recheck that file whenever NPM is bumped.
  # Inline `content` (Docker Compose >= 2.23.1) is copied into the container,
  # not bind-mounted: NPM's startup chowns /etc/nginx/conf.d under `set -e`,
  # which aborts on a read-only mount and re-owns a writable one on the host.
  # Compose copies it only when it creates the container, and an edit to
  # `content` alone doesn't recreate it: rename the entry along with the edit
  # so that `up -d` delivers it.
  npm_tls_sessions:
    content: |
      ssl_session_tickets off;
      ssl_session_cache shared:SSL:50m;
