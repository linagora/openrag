global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "nvidia-gpu-exporter"
    static_configs:
      - targets: ["nvidia-gpu-exporter:9835"]

  # GET /metrics on the API port, over the compose network (plain HTTP, like
  # every other request on that network). The bearer file is written from
  # METRICS_TOKEN in .env by monitoring.docker-compose.yaml, so the token
  # never appears in this file and both sides always agree on it.
  - job_name: "openrag"
    metrics_path: "/metrics"
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/openrag_token
    static_configs:
      - targets: ["openrag:8080"]

  # Ray's metrics agent inside the API container (embedded Ray), on the port
  # monitoring.docker-compose.yaml pins with RAY_METRICS_EXPORT_PORT. Metrics
  # recorded in Ray actors (indexing, embed and VLM calls) are exported here,
  # not on /metrics. No credential: the agent has none, which is why the port
  # stays off the host.
  - job_name: "ray"
    static_configs:
      - targets: ["openrag:8091"]
    metric_relabel_configs:
      # Ray prefixes what it exports with ray_. Stripping it from OpenRAG's
      # series stores them under the names the API exports and the alert rules
      # query, as the Helm chart's Ray PodMonitor does. Ray's own ray_* metrics
      # keep their names. Only the name changes: WorkerId must survive, or
      # concurrent workers' series collide and the whole scrape is rejected.
      - source_labels: [__name__]
        regex: ray_(openrag_.+)
        target_label: __name__
        replacement: $1
