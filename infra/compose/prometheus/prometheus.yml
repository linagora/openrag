global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "nvidia-gpu-exporter"
    static_configs:
      - targets: ["nvidia-gpu-exporter:9835"]

  # GET /metrics on the API port. Open by default; if METRICS_TOKEN is set in
  # the OpenRAG .env, mount the same value as a file and uncomment the
  # authorization block (never inline the token in this file).
  - job_name: "openrag"
    metrics_path: "/metrics"
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/openrag_token
    static_configs:
      - targets: ["openrag:8080"]
