global:
  scrape_interval: 15s
  evaluation_interval: 15s

# OpenRag's alert rules. The directory is the chart's rules/ (mounted by
# monitoring.docker-compose.yaml), the same files the Helm chart ships as a
# PrometheusRule. This stack has no Alertmanager: firing alerts show on
# Prometheus's /alerts page; point alerting.alertmanagers at one to be paged.
rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "nvidia-gpu-exporter"
    static_configs:
      - targets: ["nvidia-gpu-exporter:9835"]

  # GET /metrics on the API port, over the compose network (plain HTTP, like
  # every other request on that network). The bearer file is written from
  # METRICS_TOKEN in .env by monitoring.docker-compose.yaml, so the token
  # never appears in this file and both sides always agree on it.
  - job_name: "openrag"
    metrics_path: "/metrics"
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/openrag_token
    static_configs:
      - targets: ["openrag:8080"]
