global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules, generated from the chart's rule template with default values
# (scripts/gen_alert_rules.py) and mounted by the monitoring overlay. Kubernetes
# renders the same template with its own threshold values, so both deployments
# alert on one definition instead of two that drift.
#
# There is no Alertmanager in this overlay: rules evaluate and show as firing in
# the Prometheus UI (Alerts tab), but nothing routes or notifies. Point
# `alerting.alertmanagers` at one to receive them.
rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "nvidia-gpu-exporter"
    static_configs:
      - targets: ["nvidia-gpu-exporter:9835"]

  - job_name: "openrag"
    metrics_path: "/metrics"
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/openrag_token
    static_configs:
      - targets: ["openrag:8080"]
