# NATS config for the off-Ray marker stack.
# max_payload is a config-file-only option (no CLI flag): results (markdown +
# base64 images) still flow through NATS today and an image-heavy PDF exceeds the
# 1MB default. Interim unblock; the production fix is a result-side object-store
# handoff (E1 follow-up).
http_port: 8222
max_payload: 33554432

jetstream {
  store_dir: "/data"
}
