# Mirrors api.middleware.security_headers so the statically served admin UI
# carries the same hardening headers as API responses (those go through
# SecurityHeadersMiddleware; these are served by nginx and never hit it).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security $hsts_header always;

# The SPA build has no inline scripts (module script tag with an external
# src) but does use inline style attributes, so style-src needs
# 'unsafe-inline'. Everything else stays same-origin only.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
