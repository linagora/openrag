# Front door for the OpenRag admin UI.
#
# Serves the static SPA under /app/ and reverse-proxies everything else to the
# OpenRag API (compose network alias `openrag`, port 8080). Because the SPA and
# API share one origin, the bundle is built with VITE_API_BASE_URL="" (relative
# calls), so there is no CORS and the OIDC session cookie works cleanly.

# Honor an upstream X-Forwarded-Proto (e.g. from a TLS-terminating load balancer)
# so the backend sees the real external scheme — OIDC redirect URIs and Secure
# session cookies stay https end to end. Falls back to $scheme for direct access
# (no proxy in front), where $http_x_forwarded_proto is empty.
map $http_x_forwarded_proto $forwarded_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Echo the client's Upgrade intent through to the backend. Chainlit's Socket.IO
# transport (/chainlit/ws/socket.io) opens on HTTP long-polling and then upgrades
# to a WebSocket; without this the upgrade fails and it polls forever, issuing one
# request per emitted packet. Must be a map, not a hardcoded `Connection: upgrade`
# — that header on an ordinary request breaks the proxied connection.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # 8080 (unprivileged): the image runs nginx as a non-root user so it works
    # under a hardened container security context. The published host port is
    # ADMIN_UI_PORT (compose) / the ingress (k8s), not this internal port.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Emit relative redirects so the external port (e.g. :8081) is preserved when
    # nginx runs behind a container port mapping — otherwise /app -> /app/ would
    # 301 to the wrong port.
    absolute_redirect off;

    # Uploads can be large (document ingestion).
    client_max_body_size 1024M;

    location = /     { return 301 /app/; }
    location = /app  { return 301 /app/; }

    # Hashed, immutable build assets.
    location /app/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA — client-side routing falls back to index.html.
    location /app/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /app/index.html;
    }

    # Keep Grafana on the same browser-facing origin as the admin UI.
    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $grafana_upstream grafana;

        proxy_pass http://$grafana_upstream:3000;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header X-Forwarded-Prefix /grafana;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 300s;
    }

    # Everything else is the OpenRag API (and /chainlit, /auth, /v1, …).
    location / {
        # Resolve the backend at request time via Docker's embedded DNS so nginx
        # starts even if `openrag` isn't up yet (depends_on only waits for start),
        # instead of failing at boot with "host not found in upstream".
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $openrag_upstream openrag;
        proxy_pass http://$openrag_upstream:8080;
        # Preserve the browser-facing host exactly, including a mapped port
        # such as :8068. The backend uses Host when it emits slash redirects
        # (/chainlit -> /chainlit/), and $host would strip that port.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        # WebSocket upgrades (chainlit's Socket.IO). nginx proxies over HTTP/1.0 by
        # default, which cannot carry an upgrade, so 1.1 is required here.
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Stream SSE responses (e.g. /v1 chat) without buffering.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
