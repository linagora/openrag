# Front door for the OpenRag admin UI.
#
# Serves the static SPA under /app/ and reverse-proxies everything else to the
# OpenRag API (compose network alias `openrag`, port 8080). Because the SPA and
# API share one origin, the bundle is built with VITE_API_BASE_URL="" (relative
# calls), so there is no CORS and the OIDC session cookie works cleanly.

# Honor an upstream X-Forwarded-Proto (e.g. from a TLS-terminating load balancer)
# so the backend sees the real external scheme — OIDC redirect URIs and Secure
# session cookies stay https end to end. Falls back to $scheme for direct access
# (no proxy in front), where $http_x_forwarded_proto is empty.
map $http_x_forwarded_proto $forwarded_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    # 8080 (unprivileged): the image runs nginx as a non-root user so it works
    # under a hardened container security context. The published host port is
    # ADMIN_UI_PORT (compose) / the ingress (k8s), not this internal port.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Emit relative redirects so the external port (e.g. :8081) is preserved when
    # nginx runs behind a container port mapping — otherwise /app -> /app/ would
    # 301 to the wrong port.
    absolute_redirect off;

    # Uploads can be large (document ingestion).
    client_max_body_size 1024M;

    location = /     { return 301 /app/; }
    location = /app  { return 301 /app/; }

    # Hashed, immutable build assets.
    location /app/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA — client-side routing falls back to index.html.
    location /app/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /app/index.html;
    }

    # Everything else is the OpenRag API (and /chainlit, /auth, /v1, …).
    location / {
        # Resolve the backend at request time via Docker's embedded DNS so nginx
        # starts even if `openrag` isn't up yet (depends_on only waits for start),
        # instead of failing at boot with "host not found in upstream".
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $openrag_upstream openrag;
        proxy_pass http://$openrag_upstream:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;

        # Stream SSE responses (e.g. /v1 chat) without buffering.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
