# Off-Ray override for the FULL stack: routes the app's PDF parsing to a
# marker-serve worker over NATS (no Ray in the parsing tier), so you can index
# with marker from the admin UI.
#
# Deploy (from infra/compose/, on the off-Ray branch):
#   docker compose -f docker-compose.yaml -f off-ray.override.yaml up --build -d
#
# Everything joins the stack's `default` network, so the app reaches `nats` by
# name. `environment:` here overrides the app's env_file, so no .env edit needed.
services:
  nats:
    image: nats:2.10-alpine
    # -sd /data puts the JetStream file store on a named volume so the queue +
    # results survive a container restart/recreation (else an in-flight 2K batch
    # is lost). -m 8222 exposes monitoring for the healthcheck.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    restart: unless-stopped
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  marker-serve:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile   # same image/code as the app (+ nats-py)
      args:
        APP_UID: ${APP_UID:-1000}
    user: "0:0"
    working_dir: /app
    runtime: nvidia
    # Auto-restart a crashed worker (SIGBUS/OOM); NATS redelivers its in-flight
    # task via the ack_wait lease, so the batch resumes without manual action.
    restart: unless-stopped
    # Marker's share_memory() + ProcessPoolExecutor need a large /dev/shm; the
    # 64MB Docker default causes SIGBUS (exit 135). Match the app's value.
    shm_size: "10.24gb"
    depends_on:
      nats:
        condition: service_healthy
      minio:                          # defined in the milvus include; E1 handoff
        condition: service_healthy
    environment:
      - QUEUE_BACKEND=nats
      - NATS_URL=nats://nats:4222
      - QUEUE_NAMESPACE=openrag
      # E1 file handoff: fetch the PDF bytes by key from the in-stack MinIO
      # (large/scanned PDFs never travel through NATS). Same MinIO Milvus uses,
      # dedicated scratch bucket, same credentials. The worker auto-creates the
      # bucket on first use.
      - OBJECT_STORE_BACKEND=s3
      - OBJECT_STORE_ENDPOINT_URL=http://minio:9000
      - OBJECT_STORE_ACCESS_KEY=${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in your .env}
      - OBJECT_STORE_SECRET_KEY=${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in your .env}
      - OBJECT_STORE_BUCKET=${OBJECT_STORE_BUCKET:-openrag-parsing}
      - HF_HOME=/app/model_weights
      - PYTHONPATH=/app/openrag
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    # Bypass the image ENTRYPOINT (entrypoint.sh launches the API/Ray, not the
    # worker) and run the parser worker directly.
    entrypoint: []
    command: ["sh", "-c", "uv run --no-dev python -m services.messaging.parser_worker"]
    volumes:
      - ${MODEL_WEIGHTS_VOLUME:-~/.cache/huggingface}:/app/model_weights  # reuse the app's surya cache
      - markerserve_venv:/app/.venv                                       # own venv (avoids sync race)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Flip the app to the off-Ray marker backend + point it at NATS + MinIO.
  openrag:
    depends_on:
      nats:
        condition: service_healthy
    environment:
      - PDFLoader=MarkerServeLoader
      - QUEUE_BACKEND=nats
      - NATS_URL=nats://nats:4222
      - QUEUE_NAMESPACE=openrag
      # E1: upload the PDF bytes to MinIO and hand the worker only the key.
      - OBJECT_STORE_BACKEND=s3
      - OBJECT_STORE_ENDPOINT_URL=http://minio:9000
      - OBJECT_STORE_ACCESS_KEY=${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in your .env}
      - OBJECT_STORE_SECRET_KEY=${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in your .env}
      - OBJECT_STORE_BUCKET=${OBJECT_STORE_BUCKET:-openrag-parsing}

volumes:
  markerserve_venv:
  nats_data:
