name: API Tests

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
        with:
          version: v2.34.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          pip install pytest httpx pytest-timeout

      - name: Build and start services
        working-directory: tests/integration/api/api_run
        run: |
          docker compose build
          docker compose up -d

          echo "Waiting for services to be ready..."

          # Wait for mock-vllm
          echo "Waiting for mock-vllm..."
          if ! timeout 60 bash -c 'until curl -sf http://localhost:8000/health 2>/dev/null; do sleep 2; done'; then
            echo "Mock VLLM failed to start"
            docker compose logs mock-vllm
            exit 1
          fi

          # Wait for OpenRAG API
          echo "Waiting for OpenRAG API..."
          # /ready runs dependency checks, unlike /health_check, so bound each
          # request and the whole wait: a hung call must not run the job into
          # its own timeout, which would cancel it before the diagnosis below.
          ready_curl="curl --connect-timeout 3 --max-time 10"
          poll_deadline=$((SECONDS + 900))
          for i in {1..180}; do
            if $ready_curl -sf http://localhost:8080/ready 2>/dev/null; then
              echo "OpenRAG API ready after $i attempts"
              break
            fi
            if (( SECONDS >= poll_deadline )); then
              echo "Readiness polling timed out after 15 minutes"
              break
            fi
            echo "Attempt $i/180 - waiting..."
            sleep 5
          done

          # Final check
          if ! $ready_curl -sf http://localhost:8080/ready; then
            echo "OpenRAG API failed to start. /ready says:"
            # The body names the failing dependency, or reports
            # startup=unavailable when the container never initialised — the
            # diagnosis this gate used to hide behind a 200 from /health_check.
            $ready_curl -s http://localhost:8080/ready || true
            echo
            docker compose logs openrag
            exit 1
          fi

          echo "All services ready!"

      - name: Run API tests
        env:
          OPENRAG_API_URL: http://localhost:8080
          AUTH_TOKEN: test-admin-token
        run: |
          cd tests/integration/api
          OPENRAG_API_URL=http://localhost:8080 python3 -m pytest . -v --timeout=120 --tb=short

      - name: Show logs on failure
        if: failure()
        working-directory: tests/integration/api/api_run
        run: |
          echo "=== OpenRAG Logs ==="
          docker compose logs openrag --tail=100
          echo "=== Mock VLLM Logs ==="
          docker compose logs mock-vllm --tail=50
          echo "=== Milvus Logs ==="
          docker compose logs milvus --tail=50

      - name: Cleanup
        if: always()
        working-directory: tests/integration/api/api_run
        run: |
          docker compose down -v
