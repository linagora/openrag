# Fast integration tests - starts full stack and verifies /health_check
# Target: under 10 minutes
#
# Builds OpenRAG from source with Docker layer caching
# Uses a mock embedder since real vLLM CPU images require AVX512
# which GitHub Actions runners don't have

name: Integration Tests

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull dependency images in background while we build OpenRAG
      - name: Pre-pull dependency images (background)
        run: |
          echo "Pulling dependency images in parallel (background)..."
          (
            docker pull postgres:15 &
            docker pull quay.io/coreos/etcd:v3.5.16 &
            docker pull minio/minio:RELEASE.2023-03-20T20-16-18Z &
            docker pull milvusdb/milvus:v2.5.4 &
            docker pull python:3.12-slim &
            wait
            echo "Background image pull complete"
          ) &
          echo $! > /tmp/pull_pid
          echo "Image pulls started in background (PID: $(cat /tmp/pull_pid))"

      # Build OpenRAG image with layer caching
      - name: Build OpenRAG image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: openrag:integration-test
          cache-from: |
            type=gha
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-latest
          cache-to: type=gha,mode=max

      # Wait for background pulls to complete
      - name: Wait for image pulls
        run: |
          if [ -f /tmp/pull_pid ]; then
            PID=$(cat /tmp/pull_pid)
            echo "Waiting for image pulls (PID: $PID)..."
            wait $PID 2>/dev/null || true
          fi
          echo "All images ready"

      # Setup environment
      - name: Setup environment
        run: |
          cp .github/workflows/integration_tests/.env ./

      # Create mock embedder script
      - name: Create mock embedder
        run: |
          cat > mock_embedder.py << 'PYTHON_EOF'
          """Mock embedder that responds to vLLM-compatible API calls."""
          from http.server import HTTPServer, BaseHTTPRequestHandler
          import json

          class MockHandler(BaseHTTPRequestHandler):
              def log_message(self, format, *args):
                  print(f"[MockEmbedder] {args[0]}")

              def do_GET(self):
                  if self.path == "/health" or self.path == "/v1/models":
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.end_headers()
                      if self.path == "/health":
                          self.wfile.write(b'{"status":"ok"}')
                      else:
                          self.wfile.write(json.dumps({
                              "data": [{"id": "ibm-granite/granite-embedding-small-english-r2"}]
                          }).encode())
                  else:
                      self.send_response(404)
                      self.end_headers()

              def do_POST(self):
                  if self.path == "/v1/embeddings":
                      content_length = int(self.headers.get("Content-Length", 0))
                      body = self.rfile.read(content_length)
                      data = json.loads(body) if body else {}

                      # Generate fake embeddings (384 dimensions for granite-small)
                      inputs = data.get("input", [])
                      if isinstance(inputs, str):
                          inputs = [inputs]

                      embeddings = []
                      for i, _ in enumerate(inputs):
                          # Simple deterministic fake embedding
                          embedding = [0.01 * (j % 100) for j in range(384)]
                          embeddings.append({"object": "embedding", "index": i, "embedding": embedding})

                      response = {
                          "object": "list",
                          "data": embeddings,
                          "model": data.get("model", "mock-model"),
                          "usage": {"prompt_tokens": len(inputs) * 10, "total_tokens": len(inputs) * 10}
                      }

                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.end_headers()
                      self.wfile.write(json.dumps(response).encode())
                  else:
                      self.send_response(404)
                      self.end_headers()

          if __name__ == "__main__":
              server = HTTPServer(("0.0.0.0", 8000), MockHandler)
              print("[MockEmbedder] Starting on port 8000...")
              server.serve_forever()
          PYTHON_EOF

      # Create standalone compose file
      - name: Create compose file
        run: |
          cat > docker-compose.integration.yaml << 'EOF'
          # Integration test - standalone compose with fast health checks
          services:
            openrag-cpu:
              image: openrag:integration-test
              volumes:
                - ./.hydra_config:/app/.hydra_config
                - ./data:/app/data
                - ./model_weights:/app/model_weights
                - ./openrag:/app/openrag
                - ./logs:/app/logs
              ports:
                - "8080:8080"
                - "8265:8265"
              networks:
                default:
                  aliases:
                    - openrag
              env_file:
                - .env
              shm_size: 4gb
              healthcheck:
                test: ["CMD", "curl", "-sf", "http://localhost:8080/health_check"]
                interval: 5s
                timeout: 3s
                retries: 30
                start_period: 30s
              depends_on:
                rdb:
                  condition: service_started
                milvus:
                  condition: service_healthy
                mock-embedder:
                  condition: service_healthy

            rdb:
              image: postgres:15
              environment:
                - POSTGRES_PASSWORD=root_password
                - POSTGRES_USER=root
              volumes:
                - ./db:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U root"]
                interval: 5s
                timeout: 3s
                retries: 10

            mock-embedder:
              image: python:3.12-slim
              networks:
                default:
                  aliases:
                    - vllm
              volumes:
                - ./mock_embedder.py:/app/mock_embedder.py:ro
              command: python /app/mock_embedder.py
              healthcheck:
                test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
                interval: 2s
                timeout: 3s
                retries: 10
                start_period: 5s

            etcd:
              image: quay.io/coreos/etcd:v3.5.16
              environment:
                - ETCD_AUTO_COMPACTION_MODE=revision
                - ETCD_AUTO_COMPACTION_RETENTION=1000
                - ETCD_QUOTA_BACKEND_BYTES=4294967296
                - ETCD_SNAPSHOT_COUNT=50000
              volumes:
                - ./volumes/etcd:/etcd
              command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
              healthcheck:
                test: ["CMD", "etcdctl", "endpoint", "health"]
                interval: 5s
                timeout: 3s
                retries: 10

            minio:
              image: minio/minio:RELEASE.2023-03-20T20-16-18Z
              environment:
                MINIO_ACCESS_KEY: minioadmin
                MINIO_SECRET_KEY: minioadmin
              volumes:
                - ./volumes/minio:/minio_data
              command: minio server /minio_data --console-address ":9001"
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
                interval: 5s
                timeout: 3s
                retries: 10

            milvus:
              image: milvusdb/milvus:v2.5.4
              command: ["milvus", "run", "standalone"]
              security_opt:
                - seccomp:unconfined
              environment:
                ETCD_ENDPOINTS: etcd:2379
                MINIO_ADDRESS: minio:9000
              volumes:
                - ./volumes/milvus:/var/lib/milvus
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
                interval: 5s
                timeout: 3s
                retries: 20
                start_period: 30s
              depends_on:
                - etcd
                - minio
          EOF

      - name: Create required directories
        run: |
          mkdir -p model_weights data db logs .hydra_config volumes/etcd volumes/minio volumes/milvus

      # Start services
      - name: Start Docker Compose stack
        run: |
          docker compose -f docker-compose.integration.yaml up -d
          echo "Services starting..."
          docker compose -f docker-compose.integration.yaml ps

      # Wait for health check
      - name: Wait for services to be healthy
        run: |
          echo "Waiting for OpenRAG health check..."
          timeout 180 bash -c '
            while true; do
              if curl -sf http://localhost:8080/health_check > /dev/null 2>&1; then
                echo "OpenRAG is healthy!"
                break
              fi
              echo "Still waiting... checking service status:"
              docker compose -f docker-compose.integration.yaml ps
              sleep 5
            done
          '

      # Run health check test
      - name: Verify health check response
        run: |
          response=$(curl -sf http://localhost:8080/health_check)
          echo "Health check response: $response"
          if [[ "$response" == *"RAG API is up"* ]]; then
            echo "SUCCESS: Health check passed!"
          else
            echo "FAILURE: Unexpected response: $response"
            exit 1
          fi

      # Debug on failure
      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Docker Compose Status ==="
          docker compose -f docker-compose.integration.yaml ps -a
          echo ""
          echo "=== OpenRAG Logs ==="
          docker compose -f docker-compose.integration.yaml logs openrag-cpu --tail=200 || true
          echo ""
          echo "=== Mock Embedder Logs ==="
          docker compose -f docker-compose.integration.yaml logs mock-embedder --tail=100 || true
          echo ""
          echo "=== Milvus Logs ==="
          docker compose -f docker-compose.integration.yaml logs milvus --tail=50 || true
          echo ""
          echo "=== PostgreSQL Logs ==="
          docker compose -f docker-compose.integration.yaml logs rdb --tail=50 || true

      # Cleanup
      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.integration.yaml down -v || true
