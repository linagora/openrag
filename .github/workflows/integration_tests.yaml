# Fast integration tests - starts full stack and verifies /health_check
# Target: under 5 minutes (vs 45-75 min for smoke_test)
#
# Uses official pre-built vLLM CPU image from AWS ECR:
# https://gallery.ecr.aws/q9t5s3a7/vllm-cpu-release-repo

name: Integration Tests

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Official vLLM CPU image from AWS ECR (no build required)
  VLLM_CPU_IMAGE: public.ecr.aws/q9t5s3a7/vllm-cpu-release-repo:v0.9.2
  OPENRAG_IMAGE: ghcr.io/${{ github.repository }}:dev-latest

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
        with:
          version: v2.34.0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pre-pull all images in parallel for speed
      - name: Pre-pull Docker images
        run: |
          echo "Pulling all images in parallel..."
          docker pull postgres:15 &
          docker pull quay.io/coreos/etcd:v3.5.16 &
          docker pull minio/minio:RELEASE.2023-03-20T20-16-18Z &
          docker pull milvusdb/milvus:v2.5.4 &
          docker pull ${{ env.OPENRAG_IMAGE }} &
          docker pull ${{ env.VLLM_CPU_IMAGE }} &
          wait
          echo "Image pull complete"

      # Setup environment
      - name: Setup environment
        run: |
          cp .github/workflows/integration_tests/.env ./

      # Create compose override with pre-built images and fast health checks
      - name: Create compose override
        run: |
          cat > docker-compose.integration.yaml << 'EOF'
          # Integration test overrides - uses pre-built images and aggressive timeouts
          include:
            - vdb/milvus.yaml

          x-openrag: &openrag_template
            image: ghcr.io/linagora/openrag2:dev-latest
            volumes:
              - ${CONFIG_VOLUME:-./.hydra_config}:/app/.hydra_config
              - ${DATA_VOLUME:-./data}:/app/data
              - ${MODEL_WEIGHTS_VOLUME:-./model_weights}:/app/model_weights
              - ./openrag:/app/openrag
              - ./logs:/app/logs
            ports:
              - "8080:8080"
              - "8265:8265"
            networks:
              default:
                aliases:
                  - openrag
            env_file:
              - .env
            shm_size: 4gb
            healthcheck:
              test: ["CMD", "curl", "-sf", "http://localhost:8080/health_check"]
              interval: 5s
              timeout: 3s
              retries: 30
              start_period: 30s

          x-vllm: &vllm_template
            networks:
              default:
                aliases:
                  - vllm
            restart: "no"
            environment:
              - VLLM_USE_V1=0
            ipc: "host"
            volumes:
              - ${MODEL_WEIGHTS_VOLUME:-./model_weights}:/root/.cache/huggingface
            healthcheck:
              test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
              interval: 5s
              timeout: 3s
              retries: 40
              start_period: 60s

          services:
            openrag-cpu:
              <<: *openrag_template
              profiles:
                - 'cpu'
              depends_on:
                rdb:
                  condition: service_started
                milvus:
                  condition: service_healthy
                vllm-cpu:
                  condition: service_healthy

            rdb:
              image: postgres:15
              environment:
                - POSTGRES_PASSWORD=root_password
                - POSTGRES_USER=root
              volumes:
                - ./db:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U root"]
                interval: 5s
                timeout: 3s
                retries: 10

            vllm-cpu:
              <<: *vllm_template
              image: public.ecr.aws/q9t5s3a7/vllm-cpu-release-repo:v0.9.2
              command: >
                --model ibm-granite/granite-embedding-small-english-r2
                --trust-remote-code
                --dtype float32
                --max-model-len 512
              profiles:
                - 'cpu'

            # Override Milvus services with faster health checks
            etcd:
              healthcheck:
                interval: 5s
                timeout: 3s
                retries: 10

            minio:
              healthcheck:
                interval: 5s
                timeout: 3s
                retries: 10

            milvus:
              healthcheck:
                interval: 5s
                timeout: 3s
                retries: 20
                start_period: 30s
          EOF

      # Cache HuggingFace models
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: model_weights
          key: hf-models-granite-embedding-small-${{ runner.os }}
          restore-keys: |
            hf-models-granite-embedding-small-
            hf-models-

      - name: Create required directories
        run: |
          mkdir -p model_weights data db logs .hydra_config
          cp -r .hydra_config/* .hydra_config/ 2>/dev/null || true

      # Start services
      - name: Start Docker Compose stack
        run: |
          docker compose -f docker-compose.integration.yaml --profile cpu up -d
          echo "Services starting..."
          docker compose -f docker-compose.integration.yaml --profile cpu ps

      # Wait for health check
      - name: Wait for services to be healthy
        run: |
          echo "Waiting for OpenRAG health check..."
          timeout 180 bash -c '
            while true; do
              if curl -sf http://localhost:8080/health_check > /dev/null 2>&1; then
                echo "OpenRAG is healthy!"
                break
              fi
              echo "Still waiting... checking service status:"
              docker compose -f docker-compose.integration.yaml --profile cpu ps
              sleep 5
            done
          '

      # Run health check test
      - name: Verify health check response
        run: |
          response=$(curl -sf http://localhost:8080/health_check)
          echo "Health check response: $response"
          if [[ "$response" == *"RAG API is up"* ]]; then
            echo "SUCCESS: Health check passed!"
          else
            echo "FAILURE: Unexpected response: $response"
            exit 1
          fi

      # Debug on failure
      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Docker Compose Status ==="
          docker compose -f docker-compose.integration.yaml --profile cpu ps -a
          echo ""
          echo "=== OpenRAG Logs ==="
          docker compose -f docker-compose.integration.yaml --profile cpu logs openrag-cpu --tail=200 || true
          echo ""
          echo "=== vLLM Logs ==="
          docker compose -f docker-compose.integration.yaml --profile cpu logs vllm-cpu --tail=100 || true
          echo ""
          echo "=== Milvus Logs ==="
          docker compose -f docker-compose.integration.yaml --profile cpu logs milvus --tail=50 || true
          echo ""
          echo "=== PostgreSQL Logs ==="
          docker compose -f docker-compose.integration.yaml --profile cpu logs rdb --tail=50 || true

      # Cleanup
      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.integration.yaml --profile cpu down -v || true
