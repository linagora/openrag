name: Unit tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install dependencies with uv
        run: |
          uv sync

      # promtool unit-tests the shipped alert rules (tests/unit/infra/
      # alert_rules.promtool.yaml). Pinned to the version the Compose overlay
      # runs, so CI checks the rules against the promtool that will evaluate
      # them. Verified by checksum: this is a binary from outside the repo
      # landing on PATH in a job that can read the workflow token.
      - name: Install promtool
        env:
          PROMETHEUS_VERSION: "2.54.1"
          PROMETHEUS_SHA256: "31715ef65e8a898d0f97c8c08c03b6b9afe485ac84e1698bcfec90fc6e62924f"
        run: |
          set -euo pipefail
          archive="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${archive}"
          echo "${PROMETHEUS_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "${archive}" --strip-components=1 \
            "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          sudo install -m 0755 promtool /usr/local/bin/promtool
          promtool --version

      # Needed to render the chart's rule template in the next step.
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      # The Compose copy of the alert rules is generated from the chart template;
      # this renders it and fails if the checked-in file differs. Without it the
      # two deployments quietly drift apart, which is the whole failure the
      # generate-and-verify layout exists to prevent.
      - name: Check the generated alert rules are up to date
        run: |
          uv run python scripts/gen_alert_rules.py --check

      # The rendered chart tests need the sub-chart archives, which are
      # git-ignored; without them those tests skip instead of running.
      - name: Cache chart dependencies
        id: chart-dependencies
        uses: actions/cache@v4
        with:
          path: infra/charts/openrag-stack/charts/*.tgz
          key: chart-dependencies-${{ hashFiles('infra/charts/openrag-stack/Chart.lock') }}

      # `helm dependency build` fetches the versions pinned in Chart.lock, but
      # only from repositories that have been added.
      - name: Fetch chart dependencies
        if: steps.chart-dependencies.outputs.cache-hit != 'true'
        run: |
          set -eo pipefail
          chart=infra/charts/openrag-stack
          sed -n 's/^ *repository: *//p' "$chart/Chart.lock" | grep '^https\?://' | sort -u | nl -w1 -s' ' |
            while read -r n url; do helm repo add "dependency-$n" "$url"; done
          helm dependency build --skip-refresh "$chart"

      - name: Run tests
        env:
          # promtool is installed above, so a skipped alert-rule test now means
          # something broke rather than "not available here". Without this the
          # suite would go green while the rules went unchecked — the same
          # failure mode as an alert rule that matches nothing.
          REQUIRE_PROMTOOL: "1"
        run: |
          uv run pytest tests/unit/
