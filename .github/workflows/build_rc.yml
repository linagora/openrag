# Build and publish release-candidate images.
#
# Git flow: release candidates are cut from a `release/X.Y.Z` branch. Tagging
# that branch with `vX.Y.Z-rc.N` publishes the api, ray, and admin-ui images
# under the `vX.Y.Z-rc.N` tag — mirroring the GA pipeline (`build.yml`) but
# guarded to `release/*` instead of `main`, and NEVER tagging `latest`.
#
# api + admin-ui -> ghcr + Docker Hub; ray -> ghcr only (same split as build.yml).
#
# The GA pipeline (`build.yml`) also triggers on `v*` tags, but its verify-tag
# job skips `-rc.` tags, so an rc tag is a no-op there. This workflow is the
# mirror image: its verify-tag job accepts only an exact `vX.Y.Z-rc.N` tag on a
# commit of `release/X.Y.Z`, and every build job needs it.
name: Build RC

on:
  push:
    tags: ["v*-rc.*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # github.event.base_ref cannot tell which branch an rc tag was cut from: it
  # is empty for a pushed tag, so a base_ref guard silently skips every build
  # (v2.3.0-rc.1). As in build.yml, verify the branch explicitly and fail loud.
  verify-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Tag name and SHA are passed as env data, never interpolated into the
      # script body: git permits ; $ ` " | & in ref names.
      - name: Verify this is an exact rc tag on its release branch
        env:
          TAG_NAME: ${{ github.ref_name }}
          TAG_SHA: ${{ github.sha }}
        run: |
          if ! printf '%s' "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'; then
            echo "::error::$TAG_NAME is not an exact release-candidate tag (vMAJOR.MINOR.PATCH-rc.N) — refusing to publish RC images."
            exit 1
          fi
          version="${TAG_NAME#v}"
          branch="release/${version%-rc.*}"
          if ! git fetch --no-tags origin "refs/heads/$branch"; then
            echo "::error::$branch does not exist — an rc tag must be cut from its release branch."
            exit 1
          fi
          if git merge-base --is-ancestor "$TAG_SHA" FETCH_HEAD; then
            echo "OK: $TAG_NAME ($TAG_SHA) is on $branch"
          else
            echo "::error::$TAG_NAME is not on $branch — refusing to publish RC images."
            exit 1
          fi

  build-and-push-image:
    runs-on: ubuntu-latest
    needs: verify-tag
    permissions:
      contents: read
      packages: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            linagoraai/openrag
          tags: |
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/api.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-image-ray:
    runs-on: ubuntu-latest
    needs: verify-tag
    permissions:
      contents: read
      packages: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ray
          tags: |
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/ray.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-image-admin-ui:
    runs-on: ubuntu-latest
    needs: verify-tag
    permissions:
      contents: read
      packages: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-admin-ui
            linagoraai/openrag-admin-ui
          tags: |
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/ui.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
