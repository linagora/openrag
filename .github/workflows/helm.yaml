name: Publish Helm Chart

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "infra/charts/**"
  workflow_dispatch:

# Runs outside main can all publish the same mutable X.Y.Z-dev tag, so they
# share one group: they queue instead of overlapping, and a newer run replaces
# a queued older one, so the tag ends up on the newest chart. Each main run is
# its own group, since main publishes one version per release and a replaced
# run would leave that version unpublished.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'dev' }}
  cancel-in-progress: false

env:
  HELM_REGISTRY: ghcr.io
  HELM_ORG: linagora

jobs:
  package-and-publish-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Set chart version
        run: |
          BASE_VERSION=$(yq '.version' infra/charts/openrag-stack/Chart.yaml)

          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            # Keep version as-is for stable
            CHART_VERSION="$BASE_VERSION"
          else
            # Only a release's bump commit moves Chart.yaml's version, so here
            # it is the last release's. A dev build is a prerelease of the next
            # patch, which sorts above that release.
            if [[ ! "$BASE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::Chart.yaml version '$BASE_VERSION' is not MAJOR.MINOR.PATCH, so the next patch cannot be computed."
              exit 1
            fi
            CHART_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-dev"
            yq -i ".version = \"${CHART_VERSION}\"" infra/charts/openrag-stack/Chart.yaml
          fi

          echo "CHART_VERSION=$CHART_VERSION" >> $GITHUB_ENV
          echo "Using chart version: $CHART_VERSION"

      - name: Helm dependency update
        run: helm dependency update infra/charts/openrag-stack

      - name: Package chart
        run: helm package infra/charts/openrag-stack --destination .

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login $HELM_REGISTRY -u ${{ github.actor }} --password-stdin

      - name: Push chart
        run: |
          helm push openrag-stack-${CHART_VERSION}.tgz oci://$HELM_REGISTRY/$HELM_ORG
