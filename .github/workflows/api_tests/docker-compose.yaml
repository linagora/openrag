# Minimal compose for API testing without VLLM
# Uses mock embedding server instead

services:  
  # Ollama openai embedder server
  ollama:
    image: alpine/ollama:latest
    ports:
      - "11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      default:
        aliases:
          - ollama
    entrypoint: /bin/sh
    command: >
      -c "
      /bin/ollama serve &
      sleep 10 &&
      /bin/ollama pull ${EMBEDDER_MODEL_NAME:-qwen3-embedding:0.6b} &&
      /bin/ollama pull gemma3:270m &&
      wait
      "

  # PostgreSQL for user/partition management
  rdb:
    image: postgres:15
    environment:
      - POSTGRES_PASSWORD=root_password
      - POSTGRES_USER=root
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Milvus dependencies
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 10s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  # OpenRAG API (build from repo root)
  openrag:
    build:
      context: ../../../
      dockerfile: Dockerfile
    environment:
      - EMBEDDER_MODEL_NAME=${EMBEDDER_MODEL_NAME:-qwen3-embedding:0.6b}
      - EMBEDDER_BASE_URL=http://ollama:11434/v1
      - EMBEDDER_API_KEY=EMPTY
      - POSTGRES_HOST=rdb
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root_password
      - VDB_HOST=milvus
      - BASE_URL=http://ollama:11434/v1/
      - API_KEY=EMPTY
      - MODEL=gemma3:270m
      - VLM_BASE_URL=http://ollama:11434/v1/
      - VLM_API_KEY=EMPTY
      - VLM_MODEL=gemma3:270m
      - RERANKER_ENABLED=false
      - WITH_CHAINLIT_UI=false
      - WITH_OPENAI_API=true
      - IMAGE_CAPTIONING=false
      - LOG_LEVEL=INFO
      - PDFLoader=PyMuPDFLoader
      - RAY_POOL_SIZE=1
      - RAY_ENABLE_UV_RUN_RUNTIME_ENV=0
      - RAY_memory_monitor_refresh_ms=0
      - PROMPTS_DIR=../prompts/example1
      - DEFAULT_FILE_QUOTA=10
      - AUTH_TOKEN=${AUTH_TOKEN:-test-admin-token}
      - SUPER_ADMIN_MODE=${SUPER_ADMIN_MODE:-true}
    ports:
      - "8080:8080"
    volumes:
      - test_data:/app/data
    depends_on:
      # ollama:
      #   condition: service_healthy
      milvus:
        condition: service_healthy
      rdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health_check"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  test_data: