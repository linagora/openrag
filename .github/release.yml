changelog:
  categories:
    - title: 🚨 BREAKING CHANGE
      labels:
        - breaking-change
    - title: 📝 Prompt updates — review customized defaults after upgrading
      labels:
        - prompt
    - title: 🚀 Features
      labels:
        - feat
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
    - title: 🔧 Tech
      labels:
        - chore
        - refactor
        - docs
        - documentation
        - test
    # Without a catch-all, a pull request with none of the labels above is
    # left out of the generated notes without a trace (#1279, #1325 and #1391
    # were, in 2.3.5). Label it, or it lands here.
    - title: 📦 Other changes
      labels:
        - "*"

  exclude:
    labels:
      - skip-changelog
    authors:
      - github-actions
      - github-actions[bot]

  template: |
    # 🚀 Release $NEXT_TAG

    $CHANGES

    ---

    ### Contributors
    $CONTRIBUTORS
