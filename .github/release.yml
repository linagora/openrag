changelog:
  categories:
    - title: 🚨 BREAKING CHANGE — if prompts change, review customized defaults after upgrading
      labels:
        - breaking-change
    - title: 📝 Prompt updates — review customized defaults after upgrading
      labels:
        - prompt
    - title: 🚀 Features
      labels:
        - feat
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
    - title: 🔧 Tech
      labels:
        - chore
        - refactor
        - docs
        - documentation
        - test

  exclude:
    labels:
      - skip-changelog
    authors:
      - github-actions
      - github-actions[bot]

  template: |
    # 🚀 Release $NEXT_TAG

    $CHANGES

    ---

    ### Contributors
    $CONTRIBUTORS
